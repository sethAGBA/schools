name: school-manager

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PUBLIC_API_HOST=${PUBLIC_API_HOST}
      - API_PORT=${API_PORT}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ConnectionStrings__Default=${POSTGRES_CONNECTION_STRING}
      - Auth__JwtSigningKey=${JWT_SIGNING_KEY}
      - Auth__RefreshTokenPepper=${REFRESH_TOKEN_PEPPER}
    expose:
      - "${API_PORT}"

volumes:
  caddy_data:
  caddy_config:

